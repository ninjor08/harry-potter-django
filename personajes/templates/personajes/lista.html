<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Personajes de Harry Potter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .contenedor {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .tarjeta {
            background-color: white;
            width: 220px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .tarjeta img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 5px;
        }

        .tarjeta h3 {
            margin: 12px 0;
        }

        .tarjeta a {
            display: inline-block;
            text-decoration: none;
            background-color: #333;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Personajes de Harry Potter</h1>

    <div class="contenedor">

        {% for personaje in personajes %}

        <div class="tarjeta">

            <img src="{{ personaje.image }}" alt="{{ personaje.fullName }}">

            <h3>{{ personaje.fullName }}</h3>

            <a href="{% url 'detalle_personaje' forloop.counter0 %}">
                Ver información
            </a>

        </div>

        {% endfor %}

    </div>

</body>
</html>
