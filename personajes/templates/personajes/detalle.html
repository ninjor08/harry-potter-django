<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle del personaje</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .detalle {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        img {
            width: 250px;
            height: 330px;
            object-fit: cover;
            border-radius: 8px;
        }

        .informacion {
            margin-top: 20px;
            text-align: left;
        }

        .volver {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="detalle">

    <h1>{{ personaje.fullName }}</h1>

    <img src="{{ personaje.image }}" alt="{{ personaje.fullName }}">

    <div class="informacion">
        <p><strong>Apodo:</strong> {{ personaje.nickname }}</p>
        <p><strong>Casa:</strong> {{ personaje.hogwartsHouse }}</p>
        <p><strong>Interpretado por:</strong> {{ personaje.interpretedBy }}</p>
        <p><strong>Hijos:</strong> {{ personaje.children }}</p>
    </div>

    <a href="{% url 'lista_personajes' %}" class="volver">
        Volver
    </a>

</div>

</body>
</html>
